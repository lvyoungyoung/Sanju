name: Backend Functions

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "scripts/edge-functions.txt"
      - "scripts/check-edge-functions.sh"
      - "scripts/deploy-edge-functions.sh"
      - "scripts/tests/study-scene-review-ai.test.ts"
      - "scripts/tests/life-scene-catalog.test.ts"
      - "scripts/tests/study-scene-limit.test.ts"
      - "scripts/tests/sentence-purpose.test.ts"
      - "scripts/tests/generation-*.test.ts"
      - "scripts/tests/speech-synthesis.test.ts"
      - "三句/LearningTopics.swift"
      - "三句/*.lproj/Localizable.strings"
      - ".github/workflows/backend-functions.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "scripts/edge-functions.txt"
      - "scripts/check-edge-functions.sh"
      - "scripts/deploy-edge-functions.sh"
      - "scripts/tests/study-scene-review-ai.test.ts"
      - "scripts/tests/life-scene-catalog.test.ts"
      - "scripts/tests/study-scene-limit.test.ts"
      - "scripts/tests/sentence-purpose.test.ts"
      - "scripts/tests/generation-*.test.ts"
      - "scripts/tests/speech-synthesis.test.ts"
      - "三句/LearningTopics.swift"
      - "三句/*.lproj/Localizable.strings"
      - ".github/workflows/backend-functions.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      function_name:
        description: "Edge Function to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - cleanup-guest-generation-jobs
          - confirm-purchase
          - create-study-scene
          - delete-account
          - extract-study-topic-expressions
          - generate-memory-v2
          - process-generation-enrichment
          - migrate-guest-credits
          - moderate-image-v1
          - recover-guest-generation
          - review-study-scene
          - synthesize-speech
          - update-profile-avatar

jobs:
  check:
    name: Check Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check functions
        run: bash scripts/check-edge-functions.sh

      - name: Test AI review validation
        run: deno test --no-lock scripts/tests/study-scene-review-ai.test.ts

      - name: Test life scene classification contracts
        run: deno test --no-lock --allow-read scripts/tests/life-scene-catalog.test.ts

      - name: Test topic matching inputs and sentence purposes
        run: deno test --no-lock --allow-read scripts/tests/study-scene-limit.test.ts scripts/tests/sentence-purpose.test.ts

      - name: Test generation retries and full-response deadlines
        run: deno test --no-lock --allow-read scripts/tests/generation-endpoint.test.ts scripts/tests/generation-timeouts.test.ts scripts/tests/generation-timing.test.ts scripts/tests/generation-enrichment-worker.test.ts

      - name: Test speech streaming and request limits
        run: deno test --no-lock --allow-read scripts/tests/speech-synthesis.test.ts

  deploy:
    name: Deploy Edge Functions
    runs-on: [self-hosted, linux, x64, aliyun-ecs]
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Aliyun Supabase functions-cli
        run: |
          curl -L https://help-static-aliyun-doc.aliyuncs.com/file-manage-files/zh-CN/20260319/yaruon/functions-cli-linux-amd64-2026-03-17 -o /tmp/functions-cli
          chmod +x /tmp/functions-cli
          file /tmp/functions-cli

      - name: Deploy selected function
        env:
          FUNCTIONS_CLI_BIN: /tmp/functions-cli
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          EXPECTED_SUPABASE_PROJECT_ID: ${{ inputs.target_environment == 'staging' && 'spb-bp1364k407p37qn7' || 'spb-bp103246ivn7q0nl' }}
          SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: bash scripts/deploy-edge-functions.sh "${{ inputs.function_name }}"
