name: Backend Enrichment Retry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  retry:
    # Opt-in per environment AFTER deploying the migration and worker.
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    runs-on: [self-hosted, linux, x64, aliyun-ecs]
    environment: ${{ matrix.target }}
    timeout-minutes: 4
    concurrency:
      group: enrichment-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Retry pending indexing jobs
        if: >-
          (github.event_name == 'schedule' && vars.GENERATION_ENRICHMENT_SWEEPER_ENABLED == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.target_environment == matrix.target)
        env:
          SUPABASE_API_URL: ${{ secrets.SUPABASE_API_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          EXPECTED_PROJECT: ${{ matrix.target == 'staging' && 'spb-bp1364k407p37qn7' || 'spb-bp103246ivn7q0nl' }}
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_API_KEY" && "$SUPABASE_API_URL" == *"$EXPECTED_PROJECT"* ]]
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "$SUPABASE_API_URL/functions/v1/process-generation-enrichment" \
            --header "Authorization: Bearer $SUPABASE_API_KEY" \
            --header "Content-Type: application/json" --data '{}'
