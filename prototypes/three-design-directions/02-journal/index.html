    function choosePhoto(){state.selectedPhoto='hiking';openDialog(dialogHead('选一个，想留下的片刻。')+'<p class="dialog-copy">试试这三张日常，或选一张自己的照片。</p><div class="sample-grid">'+Object.entries(photos).map(([key,p])=>'<button class="sample-option" data-photo="'+key+'" aria-pressed="'+(key===state.selectedPhoto)+'">'+photoTag(key)+'<span>'+esc(p.theme)+'</span></button>').join('')+'</div><label class="upload-label">'+icon('image')+'从本机选择照片<input class="sr-only" id="local-photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div id="local-preview"></div><p class="form-error" id="photo-error" role="status"></p><p class="privacy">'+icon('lock')+'照片只在当前页面预览，不上传、不识别。句子为预设示例，刷新后清除。</p><button class="primary" data-action="generate">为这一刻写几句 '+icon('arrow')+'</button>');}
    function selectSample(key){state.selectedPhoto=key;dialog.querySelectorAll('[data-photo]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.photo===key));$('#local-preview').innerHTML='';$('#photo-error').textContent='';if(pendingUrl){URL.revokeObjectURL(pendingUrl);pendingUrl=null;}$('#local-photo').value='';}
    function generate(){if(state.busy)return;state.busy=true;const key=state.selectedPhoto==='local'?'hiking':state.selectedPhoto,src=state.selectedPhoto==='local'?pendingUrl:null;dialog.innerHTML=dialogHead('让这一刻，变成一句话。')+'<div class="loading" role="status"><div class="loading-line" aria-hidden="true"></div><h3>正在整理几句灵感</h3><p>只是一段安静的本地模拟。<br>没有照片上传，也没有网络请求。</p></div><button class="secondary" data-action="close-dialog">取消</button>';$('.icon-button',dialog).focus();generationTimer=setTimeout(()=>{state.resultPhoto=key;state.resultSrc=src;state.tab=0;state.view='results';state.route='home';state.history.unshift({photo:key,src,date:'刚刚',title:words[key][3][0],zh:words[key][3][1]});if(src)pendingUrl=null;closeDialog(false);render(true);toast('六句灵感已写好，选几句留在手记里。');},1150);}
    function createTopic(){openDialog(dialogHead('给喜欢的句子，一个主题。')+'<p class="dialog-copy">把散落的表达，放在同一页。</p><form id="topic-form"><label class="field-label" for="topic-name">主题名称</label><input id="topic-name" name="name" type="text" maxlength="18" placeholder="例如：周末的小美好" autocomplete="off" required><p class="field-label" style="margin-top:20px">选择要收进来的句子</p><div class="check-list">'+[...state.favorites].map(id=>'<label class="check-row"><input type="checkbox" name="sentences" value="'+id+'"><span lang="en">'+esc(byId(id).en)+'</span></label>').join('')+'</div><p class="form-error" id="topic-error" role="status"></p><button class="primary" type="submit">收进新主题 '+icon('arrow')+'</button></form>');}
    function preferences(){openDialog(dialogHead('读得舒服，就很好。')+'<p class="dialog-copy">偏好仅在这次浏览中保留。</p><label class="preference">显示中文释义<input type="checkbox" id="pref-chinese" '+(state.showChinese?'checked':'')+'></label><label class="preference">慢速朗读<input type="checkbox" id="pref-slow" '+(state.slowVoice?'checked':'')+'></label><p class="privacy">'+icon('volume')+'朗读只使用设备已有的离线英文语音；若设备没有可用语音，会保留文字提示。</p><div class="dialog-actions"><button class="primary" data-action="save-preferences">保存偏好</button></div>');}
    function infoDialog(type){const content={credits:['生成额度','这里可以放心试。','<p>原型中的生成次数不限，不消耗额度，也不会产生费用。</p><h3>这不是付费服务</h3><p>每张示例照片对应 6 句预设英文。选择自己的照片时，也只会显示演示句子，不进行图片识别。</p>'],privacy:['照片与隐私','只留在眼前这一页。','<p>本机照片通过浏览器临时地址预览，不上传服务器，不发送到任何模型。</p><p>收藏、主题、偏好和练习进度只保存在当前页面内存中，刷新即恢复初始示例。</p><p>没有账号、分析追踪、外部字体或后端服务。朗读仅选择设备的离线语音。</p>'],about:['关于三句','日常，是最好的语言。','<p>三句从一张照片开始，让英文与真正发生过的生活连在一起。不是背下更多，而是留下几句愿意说出口的话。</p><h3>句子手记 / 设计原型 B</h3><p>用纸页、细线和文字的节奏，做一本私人语言手记。照片来自此项目的共享示例素材。</p><p>当前为独立 HTML 交互演示，所有内容与生成流程均为模拟。无登录、无付费、无后端。</p>']}[type];openDialog(dialogHead(content[0])+'<div class="about-copy"><h3>'+content[1]+'</h3>'+content[2]+'</div><div class="dialog-actions"><button class="secondary" data-action="close-dialog">回到手记</button></div>');}
    function speak(id){if(!('speechSynthesis' in window)){toast('此浏览器无法朗读，可以先读一遍屏幕上的句子。');return;}const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.localService&&/^en[-_]/i.test(v.lang));if(!voice){toast('设备暂未提供离线英文语音；照片和句子不会发送到网络。');return;}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(byId(id).en);utterance.voice=voice;utterance.lang=voice.lang;utterance.rate=state.slowVoice?.75:.9;utterance.onerror=()=>toast('朗读暂不可用，请稍后再试。');window.speechSynthesis.speak(utterance);toast('正在朗读这句英文');}
    function startStudy(){const t=state.themes.find(t=>t.id===state.currentTheme);state.studySource=state.view==='favorites'?'favorites':'theme';state.studyIds=(state.studySource==='favorites'?[...state.favorites]:themeItems(t)).slice(0,3);if(!state.studyIds.length){toast('先收藏一句，再来温习。');return;}state.studyIndex=0;state.answerShown=false;state.view='exercise';render(true);}
    function showAnswer(){state.answerShown=true;render();main.focus({preventScroll:true});toast('读一遍，也是在慢慢记住。');}
    function checkAnswer(value){const s=byId(state.studyIds[state.studyIndex]);if(value.trim().toLowerCase()===s.word.toLowerCase()){state.answerShown=true;render();main.focus({preventScroll:true});toast('是这个词。这一句，你记得。');}else{$('.blank').textContent=value;main.querySelectorAll('[data-answer]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.answer===value)));$('#answer-feedback').textContent='还不是这个词，再选一次，或读一遍完整的句子。';}}
    const actions={
      'choose-photo':choosePhoto,'close-dialog':()=>closeDialog(),'generate':generate,'create-topic':createTopic,'preferences':preferences,'credits':()=>infoDialog('credits'),'privacy':()=>infoDialog('privacy'),'about':()=>infoDialog('about'),
      'result-back':()=>navigate(state.route),'start-study':startStudy,'reveal':showAnswer,'favorites':()=>{state.view='favorites';render(true);},
      'save-preferences':()=>{state.showChinese=$('#pref-chinese').checked;state.slowVoice=$('#pref-slow').checked;closeDialog();toast('阅读偏好已保存，本次浏览有效。');},
      'leave-study':()=>openDialog(dialogHead('这一页，先读到这里？')+'<p class="dialog-copy">已收藏的句子还在，随时可以重新温习。</p><div class="dialog-actions"><button class="primary" data-action="close-dialog">继续温习</button><button class="secondary" data-action="confirm-leave">回到主题</button></div>'),
      'confirm-leave':()=>{closeDialog(false);state.view=state.studySource==='favorites'?'favorites':'detail';render(true);},
      'next-question':()=>{state.reviewed.add(state.studyIds[state.studyIndex]);if(state.studyIndex<state.studyIds.length-1){state.studyIndex++;state.answerShown=false;state.view='exercise';}else{state.themes.forEach(t=>{t.reviewed=Math.max(t.reviewed,themeItems(t).filter(id=>state.reviewed.has(id)).length);});state.view='complete';}render(true);}
    };
    document.addEventListener('click',event=>{const button=event.target.closest('button,a[data-route]');if(!button)return;
      if(button.dataset.route){event.preventDefault();navigate(button.dataset.route);return;}
      if(button.dataset.action){actions[button.dataset.action]?.();return;}
      if(button.dataset.answer){checkAnswer(button.dataset.answer);return;}
      if(button.dataset.photo){selectSample(button.dataset.photo);return;}
      if(button.dataset.theme){state.currentTheme=button.dataset.theme;state.view='detail';render(true);return;}
      if(button.dataset.memory!==undefined){const index=Number(button.dataset.memory),entry=state.history[index],fallback=['hiking','cat','toddler'][index-state.history.length];state.resultPhoto=entry?entry.photo:fallback;state.resultSrc=entry?.src||null;state.tab=1;state.view='results';render(true);return;}
      if(button.dataset.tab!==undefined){state.tab=Number(button.dataset.tab);render();$('[data-tab="'+state.tab+'"]').focus();return;}
      if(button.dataset.speak){speak(button.dataset.speak);return;}
      if(button.dataset.save){const id=button.dataset.save,saved=state.favorites.has(id);saved?state.favorites.delete(id):state.favorites.add(id);render();const replacement=$('[data-save="'+id+'"]');if(replacement)replacement.focus({preventScroll:true});else main.focus({preventScroll:true});toast(saved?'已从收藏中移出。':'已加入收藏。');}
    });
    document.addEventListener('keydown',event=>{const tab=event.target.closest('[role=tab]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();state.tab=event.key==='Home'?0:event.key==='End'?1:1-state.tab;render();$('[data-tab="'+state.tab+'"]').focus();}});
    document.addEventListener('change',event=>{if(event.target.id!=='local-photo')return;const file=event.target.files[0];if(!file)return;const error=$('#photo-error');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)||file.size>12*1024*1024){error.textContent='请选择 12 MB 以内的 JPG、PNG、WebP 或 GIF 图片。';event.target.value='';return;}if(pendingUrl)URL.revokeObjectURL(pendingUrl);pendingUrl=URL.createObjectURL(file);state.selectedPhoto='local';state.localName=file.name;dialog.querySelectorAll('[data-photo]').forEach(b=>b.setAttribute('aria-pressed','false'));$('#local-preview').innerHTML='<div class="local-preview"><img src="'+esc(pendingUrl)+'" alt="本机照片预览"><p>'+esc(file.name)+'<br><span class="muted">仅在本机预览 · 使用通用演示句子</span></p></div>';error.textContent='';$('#local-preview img').onerror=()=>{error.textContent='这张图片暂时无法显示，请换一张照片。';selectSample('hiking');error.textContent='这张图片暂时无法显示，请换一张照片。';};});
    document.addEventListener('submit',event=>{if(event.target.id==='topic-form'){event.preventDefault();const name=$('#topic-name').value.trim(),selected=[...dialog.querySelectorAll('input[name=sentences]:checked')].map(i=>i.value);if(!name||!selected.length){$('#topic-error').textContent=!name?'给这个主题起个名字吧。':'请至少选择一句喜欢的表达。';$('#topic-name').setAttribute('aria-invalid',String(!name));$('#topic-name').setAttribute('aria-describedby','topic-error');if(!name)$('#topic-name').focus();return;}const theme={id:'personal-'+Date.now(),name,photo:byId(selected[0]).photo,ids:selected,reviewed:0};state.themes.push(theme);state.currentTheme=theme.id;state.view='detail';closeDialog(false);render(true);toast('新主题已收进手记。');}
    });
    dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
    dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)closeDialog();}});
    // Parent comparison pages may synchronise the four routes. No cross-origin messages are trusted.
    window.addEventListener('message',event=>{const sameOrigin=event.origin===location.origin;const localFile=location.protocol==='file:'&&event.origin==='null';if(!sameOrigin&&!localFile)return;if(event.source!==window.parent&&event.source!==window)return;const data=event.data;if(!data||typeof data!=='object'||data.type!=='sanju:navigate'||!Object.hasOwn(routes,data.screen))return;navigate(data.screen);});
    window.addEventListener('popstate',()=>navigate(new URLSearchParams(location.search).get('screen')||'home',false));
    const initialScreen=new URLSearchParams(location.search).get('screen');if(Object.hasOwn(routes,initialScreen))state.route=initialScreen;
    render();
  </script>
</body>
</html>
