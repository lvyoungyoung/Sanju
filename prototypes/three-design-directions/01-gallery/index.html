function notify(message){const el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=message;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),3500);}
function header(){return `<header class="topbar pad"><div class="brand"><span class="wordmark">三句</span><span class="brand-dot"></span><span class="eyebrow">DAILY<br>MOMENTS</span></div><span class="edition">LIFE, IN WORDS.</span></header>`;}

function render(){const views={home:homeView,memories:memoryView,learn:learnView,profile:profileView,preview:previewView,loading:loadingView,result:resultView,theme:themeView,favorites:favoriteView,study:studyView,complete:completeView};main.innerHTML=`<div class="page">${(views[state.page]||homeView)()}</div>`;nav.innerHTML=[['home','plus','新的'],['memories','image','回忆'],['learn','book','学习'],['profile','user','我的']].map(([key,ic,label])=>`<button data-action="nav" data-page="${key}" ${state.nav===key?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('');}
function homeView(){return `${header()}<div class="home-title" lang="en">A little life.<br>A little <em>English.</em></div><figure class="home-hero">${photo(scenes.cat)}<span class="sample-label">灵感示例 · 尚未选图</span></figure><section class="home-message"><h1>从你的生活里，<br>学会一句英语。</h1><button class="primary home-cta" data-action="choose">${icon('plus')}<span>选一张照片</span>${icon('arrow','end')}</button><p class="hint center home-hint">选你愿意记住的画面。</p></section>`;}
function memoryView(){return `${header()}<section class="page-heading"><div class="eyebrow muted">YOUR EVERYDAY ARCHIVE</div><div class="english" lang="en">Days worth keeping.</div><h1>回忆，有了新的说法。</h1><p>${3+state.records.length} 个生活片刻 · 照片与英语，一起留住</p></section><div class="pad">${state.records.map((r,i)=>`<button class="custom-theme" data-action="open-result" data-scene="${r.scene}" data-origin="memories">${photo(getScene(r.scene))}<span><strong>${escapeHTML(getScene(r.scene).title)}</strong><small>刚刚 · 6 句表达 · ${r.scene==='local'?'本地照片':'示例体验'}</small></span>${icon('chevron')}</button>`).join('')}<button class="memory-feature" data-action="open-result" data-scene="hiking" data-origin="memories"><div class="photo-frame">${photo(scenes.hiking)}<span class="photo-label">SEPTEMBER 16 · 示例回忆</span></div><div class="memory-meta"><h2>把周末，交给山野</h2>${icon('arrow')}</div><p class="memory-sub" lang="en">Somewhere, out there.</p></button><div class="memory-grid">${['cat','toddler'].map(id=>`<button data-action="open-result" data-scene="${id}" data-origin="memories">${photo(scenes[id])}<h3>${scenes[id].title}</h3><p>${scenes[id].date} · 6 sentences</p></button>`).join('')}</div><div class="note-line"><span>每张照片，都是生活的注脚。</span><span>三句 / ARCHIVE</span></div></div>`;}
function learnView(){return `${header()}<section class="page-heading learn-heading"><div class="eyebrow muted">WORDS THAT STAY WITH YOU</div><div class="english" lang="en">Make it your own.</div><h1>把喜欢的，慢慢学会。</h1></section><div class="pad"><button class="summary" data-action="go" data-page="favorites"><span class="number">${state.favorites.size}</span><span class="summary-copy"><strong>句收藏，来自你的生活</strong><span class="hint">不是背下来，是下次自然地说出来。</span></span>${icon('arrow')}</button><div class="section-heading"><h2>按生活的主题</h2><span class="eyebrow muted">COLLECTIONS</span></div><button class="theme-feature" data-action="theme" data-theme="hiking">${photo(scenes.hiking)}<div class="theme-title"><span class="serif" lang="en">The great outdoors</span><h3>户外风景<small>${themeIds('hiking').length} 句表达</small></h3></div></button><div class="theme-grid">${['cat','toddler'].map(id=>`<button class="theme-small" data-action="theme" data-theme="${id}">${photo(scenes[id])}<h3>${scenes[id].name}</h3><p lang="en">${scenes[id].themeEnglish}</p><p class="hint">${themeIds(id).length} 句表达</p></button>`).join('')}</div>${state.themes.map((t,i)=>`<button class="custom-theme" data-action="theme" data-theme="custom-${i}">${photo(scenes[t.scene])}<span><strong>${escapeHTML(t.name)}</strong><small>${themeIds('custom-'+i).length} 句表达 · 我的主题</small></span>${icon('chevron')}</button>`).join('')}<button class="secondary create-theme" data-action="create-theme">${icon('plus')}创建我的主题</button><div class="note-line"><span>熟悉的画面，更容易记住。</span><span>TAKE YOUR TIME.</span></div></div>`;}
function profileView(){return `${header()}<section class="profile-portrait"><div class="avatar" aria-hidden="true">Y.</div><div><h1>生活的收藏家</h1><p>本地体验者 · 不必急，慢慢来。</p></div></section><div class="profile-editorial"><p lang="en">Your life is<br>your best textbook.</p><span class="hint">生活，就是最好的课本。</span>${icon('sun')}</div><div class="pad"><section class="settings-group"><h2>YOUR LITTLE SPACE</h2><button class="settings-row" data-action="credits">${icon('layers')}<span class="row-title">我的灵感额度</span><span class="value">30 次 · 演示</span>${icon('chevron','chevron')}</button><button class="settings-row" data-action="go" data-page="favorites">${icon('heart')}<span class="row-title">我的收藏</span><span class="value">${state.favorites.size} 句</span>${icon('chevron','chevron')}</button></section><section class="settings-group"><h2>AT YOUR OWN PACE</h2><button class="settings-row" data-action="translation" role="switch" aria-checked="${state.translation}">${icon('globe')}<span class="row-title">显示中文释义</span><span class="toggle" aria-hidden="true"></span></button><button class="settings-row" data-action="voice">${icon('sound')}<span class="row-title">朗读速度</span><span class="value">${state.rate===0.75?'慢一点':'自然语速'}</span>${icon('chevron','chevron')}</button><button class="settings-row" data-action="privacy">${icon('settings')}<span class="row-title">本地数据与隐私</span>${icon('chevron','chevron')}</button><button class="settings-row" data-action="about">${icon('info')}<span class="row-title">关于三句</span><span class="value">生活画册</span>${icon('chevron','chevron')}</button></section><p class="profile-bottom"><span class="serif">A little English. A little closer.</span>独立设计原型 · 所有额度与回忆均为示例</p></div>`;}
function previewView(){const s=getScene(state.selected);return `${miniHeader('你的这一刻','home','<button class="text-button" data-action="choose">换一张</button>')}${photo(s,'preview-image')}<div class="preview-copy"><div class="eyebrow muted">A PHOTO. A FEW NEW WORDS.</div><h1 style="margin-top:10px">每个画面，都有话可说。</h1><p>用三句描述眼前，再用三句表达心情。<br>把熟悉的生活，换一种语言说出来。</p><button class="primary" data-action="generate"><span>生成这一刻的英语</span>${icon('arrow')}</button><p class="hint center">${s.id==='local'?'本地演示：不识别照片，展示通用示例句子。':'示例生成 · 不调用 AI，不消耗真实额度。'}</p></div>`;}
function loadingView(){const s=getScene(state.selected);return `<div class="loading-page">${photo(s,'loading-photo')}<div class="eyebrow muted">FINDING THE WORDS</div><h1 style="margin-top:12px">为这一刻，找一些词。</h1><p role="status">正在整理画面与生活表达…</p><div class="loading-line" aria-hidden="true"></div><button class="text-button" style="margin-top:30px" data-action="go" data-page="preview">返回照片</button><p class="hint">模拟生成，不会上传照片</p></div>`;}
function sentenceCard(id,index){const s=sentenceMap[id];const liked=state.favorites.has(id);return `<article class="sentence"><div class="sentence-top"><span class="sentence-number">${String(index+1).padStart(2,'0')}</span><h3 lang="en">${escapeHTML(s.en)}</h3></div>${state.translation?`<p class="translation">${s.zh}</p>`:''}<div class="sentence-controls"><button class="listen" data-action="speak" data-id="${id}" aria-label="朗读：${escapeHTML(s.en)}">${icon('sound')}<span>听听怎么说</span></button><button class="icon-button heart" data-action="favorite" data-id="${id}" aria-label="${liked?'取消收藏':'收藏'}：${escapeHTML(s.en)}" aria-pressed="${liked}">${icon('heart')}</button></div></article>`;}
function resultView(){const s=getScene();const ids=s.lines.map((_,i)=>`${s.id}-${i}`).filter(id=>sentenceMap[id].type===state.resultTab);return `${miniHeader('这一刻的六句英语',state.returnPage)}${photo(s,'result-photo')}<section class="result-heading"><div class="eyebrow">A MOMENT, IN YOUR WORDS.</div><h1 lang="en">${s.english}</h1><p>${s.id==='local'?'通用示例表达 · 未进行照片识别':s.title+' · 示例生成'}</p></section><div class="tabs" role="tablist" aria-label="句子类型"><button id="tab-description" role="tab" aria-controls="sentence-panel" aria-selected="${state.resultTab==='description'}" tabindex="${state.resultTab==='description'?0:-1}" data-action="result-tab" data-tab="description">画面描述 · 3</button><button id="tab-expression" role="tab" aria-controls="sentence-panel" aria-selected="${state.resultTab==='expression'}" tabindex="${state.resultTab==='expression'?0:-1}" data-action="result-tab" data-tab="expression">生活表达 · 3</button></div><div id="sentence-panel" class="pad" role="tabpanel" aria-labelledby="tab-${state.resultTab}" tabindex="0">${ids.map(sentenceCard).join('')}</div><div class="result-footer"><button class="secondary" data-action="nav" data-page="learn">${icon('book')}去学习收藏的句子${icon('arrow')}</button><p class="hint center">喜欢的句子，点一下爱心就能留下。</p></div>`;}
function themeInfo(key=state.theme){if(key.startsWith('custom-')){const t=state.themes[Number(key.split('-')[1])];if(t)return {...t,english:'A collection of your own'};}const s=getScene(key);return {name:s.name,scene:s.id,english:s.themeEnglish};}
// Topics match every generated sentence in the scene, independently of favorites.
function themeIds(key=state.theme){const scene=key.startsWith('custom-')?state.themes[Number(key.split('-')[1])]?.scene:key;return Object.values(sentenceMap).filter(sentence=>sentence.scene===scene).map(sentence=>sentence.id);}
function themeView(){const t=themeInfo(),ids=themeIds();return `${miniHeader('我的生活主题','learn')}${photo(getScene(t.scene),'theme-cover')}<div class="theme-detail-title"><div class="eyebrow muted">A PERSONAL COLLECTION</div><h1 lang="en">${escapeHTML(t.english)}</h1><h2>${escapeHTML(t.name)}</h2><p>${ids.length} 句表达 · 让表达，回到熟悉的场景里。</p></div><div class="study-intro"><button class="primary" data-action="start-study" data-source="theme">${icon('book')}开始轻复习${icon('arrow','end')}</button><p class="hint center">每次最多 3 句，没有倒计时，慢慢想。</p></div><div class="pad">${ids.length?ids.map(sentenceCard).join(''):'<div class="empty"><h3>还没有匹配的表达</h3><p>为相关照片生成句子后，就会出现在这里。</p><button class="secondary" data-action="theme-result">看看示例句子</button></div>'}</div>`;}
function favoriteView(){return `${miniHeader('我的收藏',state.nav==='profile'?'profile':'learn')}<section class="page-heading"><div class="eyebrow muted">YOUR POCKET PHRASEBOOK</div><div class="english" lang="en">Words to keep.</div><h1>${state.favorites.size} 句，想再说一次。</h1><p>收藏与偏好保存在这个浏览器里。</p></section><div class="pad">${state.favorites.size?`<button class="primary" data-action="start-study" data-source="favorites">${icon('book')}开始学习${icon('arrow','end')}</button><p class="hint center" style="margin-top:10px">按收藏顺序，慢慢学会每一句。</p>${[...state.favorites].map(sentenceCard).join('')}`:'<div class="empty"><h2>从一句喜欢的话开始。</h2><p>选张照片，把值得留下的英语收藏起来。</p><button class="primary" data-action="choose">选一张照片</button></div>'}</div>`;}
function studyView(){const s=sentenceMap[state.studyIds[state.studyIndex]];if(!s)return '';const options=[...s.options];const shift=(state.studyIndex+1)%options.length;const ordered=options.slice(shift).concat(options.slice(0,shift));const en=escapeHTML(s.en).replace(new RegExp(escapeHTML(s.word),'i'),`<span class="blank">${state.answered?escapeHTML(s.word):'____'}</span>`);return `${miniHeader(`轻复习 · ${state.studyIndex+1} / ${state.studyIds.length}`,state.studySource==='favorites'?'favorites':'theme')}<div class="study-progress" role="progressbar" aria-label="复习进度" aria-valuenow="${state.studyIndex}" aria-valuemin="0" aria-valuemax="${state.studyIds.length}"><span style="width:${state.studyIndex/state.studyIds.length*100}%"></span></div><figure class="study-card">${photo(getScene(s.scene))}</figure><section class="study-copy"><div class="eyebrow">BACK TO THAT MOMENT</div><h1 lang="en">${en}</h1><p class="hint">${s.zh}</p><p class="hint" style="margin-top:13px">${state.answered?'把完整的一句，轻轻说一遍。':'哪一个词，属于这个瞬间？'}</p><div class="study-options" role="group" aria-label="选择缺少的单词">${ordered.map(word=>`<button data-action="answer" data-word="${word}" class="${state.answered&&word===s.word?'correct':''}" ${state.answered?'disabled':''}>${word}${state.answered&&word===s.word?' ✓':''}</button>`).join('')}</div><p class="study-feedback" id="study-feedback" role="status">${state.answered?'就是它。这个词，又熟悉了一点。':''}</p>${state.answered?`<button class="primary" data-action="next-study">${state.studyIndex===state.studyIds.length-1?'完成这次轻复习':'下一句'}${icon('arrow')}</button><button class="listen" data-action="speak" data-id="${s.id}">${icon('sound')}听听完整的句子</button>`:'<button class="text-button" data-action="hint">想不起来？看看提示</button>'}</section>`;}
function completeView(){const fromFavorites=state.studySource==='favorites',scene=fromFavorites?sentenceMap[state.studyIds[0]]?.scene:themeInfo().scene;return `<div class="complete"><figure class="complete-photo">${photo(getScene(scene))}<span class="stamp">${icon('check')}</span></figure><p class="english" lang="en">A little more<br>part of you.</p><h1>这些话，更像你的了。</h1><p>今天，和 ${state.studyIds.length} 句英语重新见了面。<br>下次遇见这样的画面，试着说出来。</p><button class="primary" data-action="nav" data-page="learn">回到学习${icon('arrow')}</button><button class="text-button" data-action="go" data-page="${fromFavorites?'favorites':'theme'}">${fromFavorites?'再看看我的收藏':'再看看这个主题'}</button></div>`;}
function openDialog(content,cleanup){dialogTrigger=document.activeElement;dialogCleanup=cleanup||null;dialog.innerHTML=content;dialog.showModal();}

dialog.addEventListener('close',()=>{if(dialogCleanup)dialogCleanup();dialogCleanup=null;if(dialogTrigger?.isConnected)dialogTrigger.focus({preventScroll:true});});
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
function dialogHeading(title){return `<div class="dialog-heading"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-action="close-dialog" aria-label="关闭弹窗">${icon('close')}</button></div>`;}
let pendingPhoto=null;
function choosePhoto(){pendingPhoto=state.selected;openDialog(`${dialogHeading('从一个生活片刻开始。')}<p class="dialog-subtitle">选一张示例，或从你的相册里找一张。</p><div class="sample-grid">${['cat','hiking','toddler'].map(id=>`<button class="sample-choice" data-action="select-sample" data-scene="${id}" aria-label="选择示例：${scenes[id].name}" aria-pressed="${pendingPhoto===id}">${photo(scenes[id])}<span>${scenes[id].name}</span></button>`).join('')}</div><button class="secondary upload-button" data-action="upload">${icon('upload')}从本地选一张照片</button><p class="hint">照片仅在当前页面预览，不会上传。支持 JPG、PNG、WebP、GIF，最大 10 MB。</p><p id="upload-error" class="field-error" role="alert"></p><div id="photo-selection"></div><div class="dialog-actions"><button class="primary" id="confirm-photo" data-action="confirm-photo" ${pendingPhoto?'':'disabled'}>用这张照片${icon('arrow')}</button></div>`,()=>{uploadVersion++;});updatePhotoChoice();}
function updatePhotoChoice(){const slot=document.getElementById('photo-selection');if(!slot)return;slot.innerHTML=pendingPhoto?`<div class="modal-selected">${photo(getScene(pendingPhoto))}<span>已选：${pendingPhoto==='local'?'你的本地照片':getScene(pendingPhoto).name+'示例'}</span></div>`:'';dialog.querySelectorAll('[data-action="select-sample"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===pendingPhoto)));document.getElementById('confirm-photo').disabled=!pendingPhoto;}
document.getElementById('photo-upload').addEventListener('change',event=>{const file=event.target.files[0];event.target.value='';if(!file)return;const error=document.getElementById('upload-error');if(!error)return;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)||file.size>10*1024*1024){error.textContent='请选择不超过 10 MB 的 JPG、PNG、WebP 或 GIF 图片。';return;}error.textContent='';const version=++uploadVersion;const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{if(version!==uploadVersion||!dialog.open){URL.revokeObjectURL(url);return;}if(localURL)URL.revokeObjectURL(localURL);localURL=url;scenes.local.src=url;pendingPhoto='local';updatePhotoChoice();};image.onerror=()=>{URL.revokeObjectURL(url);if(version===uploadVersion&&dialog.open)error.textContent='这张图片无法打开，请换一张。';};image.src=url;});
function createTheme(){openDialog(`${dialogHeading('给生活的表达，一个家。')}<p class="dialog-subtitle">从全部照片的已生成句子中，模拟匹配相关表达，不限于收藏。此演示以所选场景作为匹配规则。</p><form id="theme-form"><label class="field-label" for="theme-name">主题名称</label><input class="field-input" id="theme-name" name="name" maxlength="20" placeholder="比如：想去的地方" required autocomplete="off" aria-describedby="theme-error"><div class="form-section"><p class="field-label" id="theme-source-label">匹配哪类生活场景？</p><div role="group" aria-labelledby="theme-source-label">${['hiking','cat','toddler'].map((id,i)=>`<label class="radio-row"><input type="radio" name="source" value="${id}" ${i===0?'checked':''}><span>${scenes[id].name} · ${themeIds(id).length} 句表达</span></label>`).join('')}</div></div><p id="theme-error" class="field-error" role="alert"></p><div class="dialog-actions"><button type="submit" class="primary">创建主题${icon('arrow')}</button></div></form>`);}
document.addEventListener('submit',event=>{if(event.target.id!=='theme-form')return;event.preventDefault();const form=event.target,name=form.elements.name.value.trim(),scene=form.elements.source.value,input=form.elements.name,error=document.getElementById('theme-error');if(!name){error.textContent='给这个主题起个名字吧。';input.setAttribute('aria-invalid','true');input.focus();return;}if(state.themes.some(t=>t.name===name)){error.textContent='已经有同名主题了，换一个名字吧。';input.setAttribute('aria-invalid','true');input.focus();return;}state.themes.push({name,scene});persist();closeDialog();state.theme='custom-'+(state.themes.length-1);navigate('theme','learn');notify('主题已创建，相关表达已完成模拟匹配。');});
function infoDialog(title,body){openDialog(`${dialogHeading(title)}<div class="dialog-body">${body}</div><div class="dialog-actions"><button class="secondary" data-action="close-dialog">知道了</button></div>`);}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel();state.speaking=null;}
function speak(id,button){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){notify('此浏览器不支持朗读，请使用支持语音的浏览器。');return;}if(state.speaking===id){stopSpeech();button.innerHTML=icon('sound')+'<span>听听怎么说</span>';return;}stopSpeech();document.querySelectorAll('[data-action="speak"]').forEach(b=>b.innerHTML=icon('sound')+'<span>听听怎么说</span>');const speech=new SpeechSynthesisUtterance(sentenceMap[id].en);speech.lang='en-US';speech.rate=state.rate;const voice=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('en')&&v.localService);if(voice)speech.voice=voice;state.speaking=id;button.innerHTML=icon('pause')+'<span>正在朗读 · 点击暂停</span>';const finish=()=>{if(state.speaking===id){state.speaking=null;if(button.isConnected)button.innerHTML=icon('sound')+'<span>听听怎么说</span>';}};speech.onend=finish;speech.onerror=e=>{finish();if(e.error!=='interrupted'&&e.error!=='canceled')notify('朗读暂不可用，请检查设备的英语语音设置。');};window.speechSynthesis.speak(speech);}
function rerenderKeepingFocus(action,id){const scroll=main.scrollTop;render();main.scrollTop=scroll;const selector=`[data-action="${action}"]${id?`[data-id="${id}"]`:''}`;main.querySelector(selector)?.focus({preventScroll:true});}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const a=button.dataset.action;
 if(a==='nav')navigate(button.dataset.page,button.dataset.page);
 else if(a==='go')navigate(button.dataset.page);
 else if(a==='choose')choosePhoto();
 else if(a==='close-dialog')closeDialog();
 else if(a==='select-sample'){uploadVersion++;pendingPhoto=button.dataset.scene;updatePhotoChoice();}
 else if(a==='upload')document.getElementById('photo-upload').click();
 else if(a==='confirm-photo'){if(!pendingPhoto)return;state.selected=pendingPhoto;closeDialog();navigate('preview','home');}
 else if(a==='generate'){if(!state.selected){choosePhoto();return;}navigate('loading','home');loadTimer=setTimeout(()=>{state.scene=state.selected;state.records.unshift({scene:state.scene});state.returnPage='home';state.resultTab='description';navigate('result','home');notify('六句英语已准备好，喜欢的就收藏。');},1700);}
 else if(a==='open-result'){state.scene=button.dataset.scene;state.returnPage=button.dataset.origin||'home';state.resultTab='description';navigate('result');}
 else if(a==='result-tab'){state.resultTab=button.dataset.tab;const scroll=main.scrollTop;render();main.scrollTop=scroll;document.getElementById('tab-'+state.resultTab).focus({preventScroll:true});}
 else if(a==='favorite'){const id=button.dataset.id,removing=state.favorites.has(id);removing?state.favorites.delete(id):state.favorites.add(id);persist();if(state.page==='favorites'||state.page==='theme'){const scroll=main.scrollTop;const oldButtons=[...main.querySelectorAll('[data-action="favorite"]')];const index=oldButtons.indexOf(button);render();main.scrollTop=scroll;const next=[...main.querySelectorAll('[data-action="favorite"]')];(next[Math.min(index,next.length-1)]||main).focus({preventScroll:true});}else{button.setAttribute('aria-pressed',String(!removing));button.setAttribute('aria-label',(removing?'收藏':'取消收藏')+'：'+sentenceMap[id].en);}notify(removing?'已从收藏中移除。':'已收藏，在「学习」里等你。');}
 else if(a==='speak')speak(button.dataset.id,button);
 else if(a==='theme'){state.theme=button.dataset.theme;navigate('theme','learn');}
 else if(a==='theme-result'){state.scene=themeInfo().scene;state.returnPage='theme';state.resultTab='description';navigate('result');}
 else if(a==='create-theme')createTheme();
 else if(a==='start-study'){const fromFavorites=button.dataset.source==='favorites',ids=fromFavorites?[...state.favorites]:themeIds();if(!ids.length){notify(fromFavorites?'先收藏一句喜欢的英语，再来学习。':'这个主题还没有匹配的表达。');return;}state.studySource=fromFavorites?'favorites':'theme';state.studyIds=fromFavorites?ids.slice():ids.slice(0,3);state.studyIndex=0;state.answered=false;navigate('study','learn');}
 else if(a==='answer'){const s=sentenceMap[state.studyIds[state.studyIndex]];if(state.answered)return;if(button.dataset.word===s.word){state.answered=true;const scroll=main.scrollTop;render();main.scrollTop=scroll;main.querySelector('[data-action="next-study"]').focus({preventScroll:true});}else{button.classList.add('wrong');document.getElementById('study-feedback').textContent='还差一点。看看画面，再试一个词。';document.getElementById('study-feedback').classList.add('error-copy');button.setAttribute('aria-label',button.dataset.word+'，再试试其他词');}}
 else if(a==='hint'){const word=sentenceMap[state.studyIds[state.studyIndex]].word;document.getElementById('study-feedback').textContent=`提示：以「${word[0]}」开头，一共 ${word.length} 个字母。`;document.getElementById('study-feedback').classList.remove('error-copy');}
 else if(a==='next-study'){if(state.studyIndex===state.studyIds.length-1)navigate('complete');else{state.studyIndex++;state.answered=false;navigate('study');}}
 else if(a==='translation'){state.translation=!state.translation;persist();rerenderKeepingFocus('translation');notify(state.translation?'中文释义已显示。':'中文释义已隐藏，轻复习中仍保留提示。');}
 else if(a==='voice'){openDialog(`${dialogHeading('用舒服的速度听。')}<p class="dialog-subtitle">朗读使用浏览器与设备提供的英语语音。</p><button class="settings-row" data-action="set-rate" data-rate="0.9"><span class="row-title">自然语速</span>${state.rate===0.9?icon('check'):''}</button><button class="settings-row" data-action="set-rate" data-rate="0.75"><span class="row-title">慢一点</span>${state.rate===0.75?icon('check'):''}</button><p class="hint" style="margin-top:18px">语音可用性与音色取决于你的浏览器和设备。</p>`);}
 else if(a==='set-rate'){state.rate=Number(button.dataset.rate);persist();closeDialog();rerenderKeepingFocus('voice');notify('朗读速度已更新。');}
 else if(a==='credits')infoDialog('给生活，留一点灵感。','<div class="credit-number">30 <span style="font:13px var(--body)">次示例额度</span></div><p>这里展示额度页面的设计。所有生成都是本地模拟，不消耗真实额度，也不连接任何支付服务。</p><p style="margin-top:14px">本原型不提供购买或订阅。</p>');
 else if(a==='privacy')infoDialog('你的照片，留在这里。','<p>本地照片只用于当前页面预览，不上传、不做图片识别；关闭或刷新后不会保留。</p><p style="margin-top:14px">收藏、主题和偏好使用此浏览器的本地存储。示例回忆与 12 句初始收藏为演示数据，没有账号或云端同步。</p><p style="margin-top:14px">朗读由浏览器提供，优先使用本地英语语音；其他语音可能由浏览器的语音服务处理。</p>');
 else if(a==='about')infoDialog('关于三句','<div class="about-wordmark">三句</div><p class="serif" style="font-size:24px;color:var(--ink)">The everyday gallery.</p><p style="margin-top:14px">从你的生活里，学会一句英语。<br>一张照片，三句画面描述，三句生活表达。<br>不追赶进度，只靠近自己的生活。</p><p style="margin-top:18px;font-size:11px">生活画册 · 独立 HTML 设计原型<br>无真实 AI、账号、支付或云端服务。</p>');
});
document.addEventListener('keydown',event=>{const tab=event.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const list=[...tab.parentElement.querySelectorAll('[role="tab"]')];let i=list.indexOf(tab);i=event.key==='Home'?0:event.key==='End'?list.length-1:(i+(event.key==='ArrowRight'?1:-1)+list.length)%list.length;list[i].click();});
// The comparison host synchronizes navigation without reaching into this document.
const comparisonRoutes={home:'home',memories:'memories',study:'learn',profile:'profile'};
function comparisonNavigate(screen){
 if(!Object.prototype.hasOwnProperty.call(comparisonRoutes,screen))return;
 clearTimeout(loadTimer);clearTimeout(toastTimer);uploadVersion++;
 document.getElementById('toast').classList.remove('visible');
 closeDialog();pendingPhoto=null;state.selected=null;state.resultTab='description';
 state.studySource='theme';state.studyIds=[];state.studyIndex=0;state.answered=false;state.returnPage='home';
 navigate(comparisonRoutes[screen],comparisonRoutes[screen]);
}
window.addEventListener('message',event=>{
 const sameOrigin=window.location.origin!=='null'&&event.origin===window.location.origin;
 const localFile=window.location.protocol==='file:'&&event.origin==='null';
 if(!(sameOrigin||localFile)||!event.data||event.data.type!=='sanju:navigate')return;
 if(typeof event.data.screen==='string')comparisonNavigate(event.data.screen);
});
window.addEventListener('pagehide',()=>{stopSpeech();if(localURL)URL.revokeObjectURL(localURL);});
const initialScreen=new URLSearchParams(window.location.search).get('screen');
if(initialScreen&&Object.prototype.hasOwnProperty.call(comparisonRoutes,initialScreen))comparisonNavigate(initialScreen);
else render();
</script>
</body>
</html>
