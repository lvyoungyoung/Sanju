    const raw={cat:[['A kitten is walking through the grass.','一只小猫正穿过草地。','grass',['grass','clouds','water']],['The sunlight feels soft and warm.','阳光柔和又温暖。','warm',['warm','loud','busy']],['Its little paws are hidden in the green.','它的小爪子藏在绿草间。','little',['little','heavy','empty']],['You make my day a little brighter.','有你在，我的一天都亮了一点。','brighter',['brighter','faster','colder']],['Let’s slow down and enjoy this moment.','让我们慢下来，享受这一刻。','moment',['moment','ticket','answer']],['A little curiosity goes a long way.','一点点好奇心，也能带你走很远。','curiosity',['curiosity','silence','rain']]],hiking:[['We are hiking in the mountains.','我们正在山间徒步。','mountains',['mountains','kitchen','office']],['The trail leads us into the green.','小径带我们走进绿意之中。','trail',['trail','train','table']],['There is a beautiful view ahead.','前方有一片美丽的风景。','view',['view','meal','song']],['Let’s take the scenic route.','我们走风景更好的那条路吧。','scenic',['scenic','sleepy','salty']],['A little fresh air does wonders.','呼吸一点新鲜空气，感觉真好。','fresh',['fresh','heavy','busy']],['One step at a time, we’ll get there.','一步一步，我们总会到达。','step',['step','book','cup']]],toddler:[['A little child is exploring the world.','一个小朋友正在探索世界。','world',['world','recipe','email']],['Everything is new through little eyes.','小小的眼睛里，一切都很新鲜。','new',['new','late','cold']],['Small hands can hold so much wonder.','小小的手里，也能装下大大的好奇。','hands',['hands','roads','rooms']],['Take your time. I’m right here.','慢慢来，我就在这里。','time',['time','seat','coat']],['Little steps, big adventures.','小小的步子，大大的冒险。','adventures',['adventures','meetings','numbers']],['Growing up happens one day at a time.','长大，就在每一个平常的日子里。','day',['day','year','night']]]};

    function generate(){const key=state.selectedPhoto;openModal(`${dialogHead('留住这个小瞬间')}<div class="loading" role="status">${icon('sun')}<h2>让画面，变成好用的表达。</h2><p>正在整理 3 句描述与 3 句生活表达</p><div class="progress"><span style="width:72%"></span></div><small class="muted">本地模拟，无需联网</small></div>`);generationTimer=setTimeout(()=>{closeModal(false);state.photo=key;state.group='scene';state.resultFrom=state.route;state.view='result';render(true)},1100)}
    function themeModal(){state.themePhoto='hiking';openModal(`${dialogHead('给喜欢的日常一个主题')}<p class="sub">选张封面，收好同一类表达。</p><form id="theme-form"><label class="field-label" for="theme-name">主题名称</label><input class="input" id="theme-name" name="themeName" autocomplete="off" maxlength="16" placeholder="比如：周末的小出走" aria-describedby="theme-error" autofocus><p class="field-error" id="theme-error" role="alert"></p><label class="field-label">封面与示例句子</label>${photoChoices('hiking','select-theme-photo')}<p class="note">${icon('info')}新主题会加入所选照片的 6 句示例，保存在当前浏览器。</p><button type="submit" class="primary center space-top">创建主题${icon('plus')}</button></form>`)}
    function infoModal(key){if(key==='reminder'){openModal(`${dialogHead('留一点时间给自己')}<p class="sub">这里只保存偏好，不会发送系统通知。</p><label class="field-label" for="reminder-time">想在什么时候学三句？</label><select class="input" id="reminder-time"><option value="不提醒">暂时不提醒</option><option value="08:00">早上 08:00</option><option value="12:30">午间 12:30</option><option value="20:30">晚上 20:30</option></select><button class="primary center space-top" data-action="save-reminder">保存偏好</button>`);document.getElementById('reminder-time').value=state.prefs.reminder||'不提醒';return}const privacy=key==='privacy';openModal(`${dialogHead(privacy?'你的照片，只属于你':'三句 · 轻盈学习')}<div class="info-copy">${privacy?'<p>示例照片来自本地素材。选择设备照片时，仅在当前页面预览，不会上传、识别或传给任何服务。</p><p>收藏、练习进度与偏好保存在当前浏览器。本地照片不会持久保存，关闭页面后需要重新选择。</p><p>朗读只使用浏览器可用的本地英文语音；没有离线语音时会提示，不会调用在线语音服务。</p>':'<p>把今天的画面，变成明天就会说的英文。</p><p>一张照片，六句表达。收藏喜欢的句子，再用一次轻轻的练习，让它们变得熟悉。</p><p>这是 C 方案的独立交互原型。没有真实生成服务、账户、云同步、订阅或支付。</p>'}</div><button class="secondary space-top" data-action="close-modal">继续慢慢学</button>`)}
    function speak(text){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('当前浏览器不支持朗读，你仍可阅读和练习。');return}const voice=window.speechSynthesis.getVoices().find(v=>v.localService&&/^en(?:-|_)/i.test(v.lang));if(!voice){toast('设备暂未提供本地英文语音，未启用在线朗读。');return}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.voice=voice;utterance.lang=voice.lang;utterance.rate=state.prefs.slow?.72:.9;utterance.onerror=()=>toast('这次朗读未能播放，请稍后再试。');window.speechSynthesis.speak(utterance);toast('正在朗读这句英文')}
    function startPractice(ids,theme=null){if(!ids.length){toast('先收藏一句喜欢的表达吧。');return}const selected=ids.slice(0,3);state.session={ids:selected,index:0,answer:null,correct:false,feedback:'',theme,previous:state.view};state.view='exercise';render(true)}
    function nextQuestion(){const q=state.session;if(!q?.correct)return;if(q.index<q.ids.length-1){q.index++;q.answer=null;q.correct=false;q.feedback='';render(true)}else{if(q.theme){const t=themeData().find(t=>t.id===q.theme);if(t)state.progress[t.id]=Math.min(6,doneCount(t)+q.ids.length)}persist();state.view='success';render(true)}}
    function back(){if(state.view==='result'){state.route=state.resultFrom;state.view='root'}else{state.route='study';state.view='root'}render(true)}
    document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,k=b.dataset.key;
      if(a==='navigate')navigate(b.dataset.route);
      else if(a==='choose'){state.selectedPhoto='cat';chooseModal()}
      else if(a==='close-modal')closeModal();
      else if(a==='select-photo'){state.selectedPhoto=k;chooseModal();modal.querySelector(`[data-key="${k}"]`)?.focus()}
      else if(a==='upload')document.getElementById('photo-input').click();
      else if(a==='generate')generate();
      else if(a==='open-photo'){state.photo=k;state.group='scene';state.resultFrom=state.route;state.view='result';render(true)}
      else if(a==='sentence-tab'){state.group=k;const y=scrollY;render();window.scrollTo(0,y);document.getElementById(`tab-${k}`).focus({preventScroll:true})}
      else if(a==='speak-home')speak('A little moment of joy.');
      else if(a==='speak')speak(getSentence(k).en);
      else if(a==='favorite'){const adding=!state.favorites.has(k);adding?state.favorites.add(k):state.favorites.delete(k);persist();b.setAttribute('aria-pressed',String(adding));toast(adding?'已收藏，在「学习」里等你。':'已取消收藏。');if(state.view==='favorites'){const y=scrollY;render();window.scrollTo(0,y);main.querySelector(`[data-action="favorite"][data-key="${k}"]`)?.focus({preventScroll:true});if(!document.activeElement||document.activeElement===document.body)main.focus({preventScroll:true})}}
      else if(a==='translation'){const el=document.getElementById(`translation-${k}`);el.hidden=!el.hidden;b.textContent=el.hidden?'查看中文':'收起中文';b.setAttribute('aria-expanded',String(!el.hidden))}
      else if(a==='memory-filter'){state.memoryFilter=k;render();main.querySelector(`[data-action="memory-filter"][data-key="${k}"]`).focus()}
      else if(a==='favorites'){state.route='study';state.view='favorites';render(true)}
      else if(a==='theme'){state.detail=k;state.view='detail';render(true)}
      else if(a==='create-theme')themeModal();
      else if(a==='select-theme-photo'){state.themePhoto=k;modal.querySelectorAll('[data-action="select-theme-photo"]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.key===k)))}
      else if(a==='preference'){state.prefs[k]=!state.prefs[k];persist();b.setAttribute('aria-checked',String(state.prefs[k]));toast('偏好已保存在当前浏览器。')}
      else if(a==='info')infoModal(k);
      else if(a==='save-reminder'){state.prefs.reminder=document.getElementById('reminder-time').value;persist();closeModal(false);render();main.querySelector('[data-key="reminder"]').focus();toast('偏好已保存，不会发送实际通知。')}
      else if(a==='back')back();
      else if(a==='practice-photo')startPractice(sentences.filter(s=>s.photo===(state.photo==='local'?'cat':state.photo)&&s.group===state.group).map(s=>s.id));
      else if(a==='practice-favorites')startPractice([...state.favorites]);
      else if(a==='practice-theme'){const t=themeData().find(t=>t.id===state.detail);const list=sentences.filter(s=>s.photo===t.photo).map(s=>s.id);const offset=doneCount(t)>=3&&doneCount(t)<6?3:0;startPractice(list.slice(offset,offset+3),t.id)}
      else if(a==='answer'){const q=state.session;q.answer=k;q.feedback='';const y=scrollY;render();window.scrollTo(0,y);main.querySelector(`[data-action="answer"][data-key="${k}"]`)?.focus({preventScroll:true})}
      else if(a==='check-answer'){const q=state.session,s=getSentence(q.ids[q.index]);q.correct=q.answer===s.word;q.feedback=q.correct?'就是这个词。把完整的句子在心里读一遍。':'再想一想，结合画面和中文试试另一个词。';const y=scrollY;render();window.scrollTo(0,y);main.querySelector(q.correct?'[data-action="next-question"]':`[data-action="answer"][data-key="${q.answer}"]`)?.focus({preventScroll:true})}
      else if(a==='next-question')nextQuestion();
      else if(a==='leave-practice')openModal(`${dialogHead('先在这里停一停？')}<p class="sub">这次练习还没完成。你的收藏不会改变。</p><div class="button-stack"><button class="primary center" data-action="close-modal">继续练习</button><button class="secondary" data-action="exit-practice">退出本次练习</button></div>`);
      else if(a==='exit-practice'){closeModal(false);state.view=state.session.previous;render(true)}
      else if(a==='finish')navigate('study');
      else if(a==='repeat')startPractice(state.session.ids,state.session.theme);
    });
    document.addEventListener('submit',event=>{if(event.target.id!=='theme-form')return;event.preventDefault();const field=document.getElementById('theme-name'),name=field.value.trim(),error=document.getElementById('theme-error');if(!name){error.textContent='给这个主题取个名字吧。';field.setAttribute('aria-invalid','true');field.focus();return}if(state.customThemes.length>=20){error.textContent='演示最多支持 20 个自建主题。';return}const t={id:`theme-${Date.now()}`,name,photo:state.themePhoto};state.customThemes.push(t);persist();closeModal(false);state.detail=t.id;state.route='study';state.view='detail';render(true);toast('主题建好了，开始收集喜欢的表达。')});
    document.addEventListener('keydown',event=>{const tab=event.target.closest('[role="tab"]');if(!tab||!['ArrowRight','ArrowLeft','Home','End'].includes(event.key))return;event.preventDefault();const next=event.key==='Home'?'scene':event.key==='End'?'life':state.group==='scene'?'life':'scene';document.getElementById(`tab-${next}`).click()});
    document.getElementById('photo-input').addEventListener('change',event=>{const file=event.target.files[0];event.target.value='';if(!file)return;const error=message=>{const el=document.getElementById('upload-error');if(el)el.textContent=message;else toast(message)};if(!['image/jpeg','image/png','image/webp'].includes(file.type)){error('请选择 JPG、PNG 或 WebP 照片。');return}if(file.size>12*1024*1024){error('请选择 12 MB 以内的照片。');return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{if(activeObjectURL)URL.revokeObjectURL(activeObjectURL);activeObjectURL=url;state.upload={src:url,alt:'用户选择的本地照片'};state.selectedPhoto='local';if(modal.open)chooseModal()};img.onerror=()=>{URL.revokeObjectURL(url);error('无法读取这张照片，请换一张试试。')};img.src=url});
    modal.addEventListener('cancel',event=>{event.preventDefault();closeModal()});
    modal.addEventListener('click',event=>{if(event.target!==modal)return;const rect=modal.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal()});
    modal.addEventListener('close',()=>{document.body.style.overflow=''});
    // The comparison parent may navigate this frame, but never from another web origin.
    window.addEventListener('message',event=>{const sameOrigin=location.origin!=='null'&&event.origin===location.origin;const localFile=location.protocol==='file:'&&event.origin==='null';if((!sameOrigin&&!localFile)||!event.data||event.data.type!=='sanju:navigate')return;if(event.source!==window.parent&&event.source!==window)return;navigate(event.data.screen)});
    const initialScreen=new URLSearchParams(location.search).get('screen');if(['home','memories','study','profile'].includes(initialScreen))state.route=initialScreen;
    render();
    window.addEventListener('pagehide',()=>{clearTimeout(generationTimer);if(window.speechSynthesis)window.speechSynthesis.cancel();if(activeObjectURL)URL.revokeObjectURL(activeObjectURL)});
  </script>
</body>
</html>
